name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet (Linux and Windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Vulnerability scan (Linux and Windows)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          GOOS=windows govulncheck ./...
