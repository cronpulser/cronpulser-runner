name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Check the tag matches the installers
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "CRONPULSER_RUNNER_VERSION:-$version}" install-runner.sh
          grep -q "else { \"$version\" }" install-runner.ps1
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build.sh
      - name: Checksums
        run: |
          cd dist
          sha256sum cronpulser-runner-linux-amd64 cronpulser-runner-linux-arm64 cronpulser-runner-windows-amd64.exe > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/cronpulser-runner-linux-amd64
            dist/cronpulser-runner-linux-arm64
            dist/cronpulser-runner-windows-amd64.exe
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            dist/cronpulser-runner-linux-amd64 dist/cronpulser-runner-linux-arm64 \
            dist/cronpulser-runner-windows-amd64.exe dist/SHA256SUMS \
            install-runner.sh install-runner.ps1
